name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install core
        run: python -m pip install -e ./core
      - name: Run backend regression suite
        run: PYTHONPATH=core/src python -m unittest discover -s core/tests -v
      - name: Compile Python sources
        run: python -m compileall -q core/src

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  package-and-docs:
    name: Package and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Check local documentation links
        run: python scripts/check_markdown_links.py
      - name: Validate semantic review sample
        run: >-
          python scripts/summarize_semantic_review.py
          docs/quality-fixtures/ruoyi-vue-semantic-review-2026-08.csv
          --expected-count 50
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/c2b-dist ./core
      - name: Verify installed CLI
        run: |
          python -m pip install /tmp/c2b-dist/c2b-*.whl
          c2b --help

  docker-postgres-smoke:
    name: Docker Compose + PostgreSQL smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - name: Build frontend and wheel inputs
        run: |
          python -m pip install build
          python -m build --wheel --outdir web/deploy/dist ./core
          pnpm --dir web/frontend install --frozen-lockfile
          pnpm --dir web/frontend build
          mkdir -p web/deploy/frontend-dist
          cp -R web/frontend/dist/. web/deploy/frontend-dist/
      - name: Prepare isolated CI configuration
        working-directory: web/deploy
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-url-safe-secret/ci-only-postgres-secret/' .env
          docker compose config --quiet
      - name: Start stack and run import/scan smoke
        working-directory: web/deploy
        run: |
          docker compose up -d --build --wait
          python smoke_test.py create --state-file /tmp/c2b-smoke-state.json
      - name: Verify persistence after API restart
        working-directory: web/deploy
        run: |
          docker compose restart api
          docker compose up -d --wait
          python smoke_test.py verify-delete --state-file /tmp/c2b-smoke-state.json
      - name: Capture container logs
        if: failure()
        working-directory: web/deploy
        run: docker compose logs --no-color
      - name: Stop stack and remove CI volumes
        if: always()
        working-directory: web/deploy
        run: docker compose down -v --remove-orphans
